services:
  - type: web
    name: wow-voice-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://wow-voice.pages.dev" # Change this to your deployed Cloudflare Pages URL

